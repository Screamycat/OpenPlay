  <rect x="796" y="320" width="84" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="796" y="342" width="124" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="796" y="342" width="88" height="6" rx="3" fill="#783efe"/>
  <rect x="796" y="362" width="124" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
