  <rect x="796" y="392" width="70" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.45"/>
  <rect x="796" y="408" width="104" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="796" y="428" width="92" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.5"/>

