<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171230"/>
      <stop offset="55%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#06070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#783efe" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroBanner" x1="428" y1="58" x2="944" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c1a5e"/>
      <stop offset="60%" stop-color="#15182c"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
  </defs>

  <!-- Base Workspace Background -->
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#glow)"/>

  <!-- Top Navigation Bar -->
  <rect width="960" height="46" fill="#08090f" fill-opacity="0.82"/>
