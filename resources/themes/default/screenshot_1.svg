  <circle cx="788" cy="497" r="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="814" y="481" width="116" height="32" rx="16" fill="#ffffff"/>
  <text x="872" y="501" text-anchor="middle" fill="#07080c" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="1">PLAY</text>
