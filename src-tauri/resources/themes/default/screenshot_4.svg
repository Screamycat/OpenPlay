<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171230"/>
      <stop offset="55%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#06070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#783efe" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#glow)"/>

  <!-- Top Navigation Bar -->
  <rect width="960" height="46" fill="#08090f" fill-opacity="0.82"/>
  <line x1="0" y1="46" x2="960" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="16" y="11" width="88" height="24" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="29" cy="23" r="6" fill="#783efe"/>
  <rect x="41" y="20" width="52" height="6" rx="3" fill="#ffffff" fill-opacity="0.88"/>
  <rect x="116" y="11" width="188" height="24" rx="7" fill="#040508" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="119" y="14" width="56" height="18" rx="5" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="181" y="19" width="52" height="8" rx="4" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="243" y="19" width="52" height="8" rx="4" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="316" y="11" width="160" height="24" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="330" y="20" width="84" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
  <!-- View Mode Switcher (Middle Button = Full Grid Active) -->
  <rect x="688" y="11" width="94" height="24" rx="7" fill="#040508" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="691" y="14" width="28" height="18" rx="5" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="722" y="14" width="28" height="18" rx="5" fill="#783efe"/>
  <rect x="753" y="14" width="26" height="18" rx="5" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="794" y="11" width="68" height="24" rx="7" fill="#783efe" fill-opacity="0.18" stroke="#783efe" stroke-opacity="0.45"/>
  <circle cx="884" cy="23" r="9" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="912" cy="23" r="6" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="934" cy="23" r="6" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Full-Width 7-Column 2:3 Poster Grid -->
  <g fill="#151828" stroke="#ffffff" stroke-opacity="0.11">
    <!-- Row 1 -->
    <rect x="26" y="68" width="114" height="171" rx="12"/>
    <rect x="158" y="68" width="114" height="171" rx="12" fill="#202540" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.95"/>
    <rect x="154" y="64" width="122" height="179" rx="15" fill="none" stroke="#783efe" stroke-width="3" stroke-opacity="0.85"/>
    <rect x="290" y="68" width="114" height="171" rx="12"/>
    <rect x="422" y="68" width="114" height="171" rx="12"/>
    <rect x="554" y="68" width="114" height="171" rx="12"/>
    <rect x="686" y="68" width="114" height="171" rx="12"/>
    <rect x="818" y="68" width="114" height="171" rx="12"/>

    <!-- Row 2 -->
    <rect x="26" y="259" width="114" height="171" rx="12"/>
    <rect x="158" y="259" width="114" height="171" rx="12"/>
    <rect x="290" y="259" width="114" height="171" rx="12"/>
    <rect x="422" y="259" width="114" height="171" rx="12"/>
    <rect x="554" y="259" width="114" height="171" rx="12"/>
    <rect x="686" y="259" width="114" height="171" rx="12"/>
    <rect x="818" y="259" width="114" height="171" rx="12"/>
  </g>

  <!-- Subtle Card Details on Hovered Card #2 -->
  <circle cx="256" cy="84" r="8" fill="#08090f" fill-opacity="0.75"/>
  <circle cx="256" cy="84" r="3.5" fill="#fbbf24"/>
  <rect x="170" y="206" width="76" height="8" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="170" y="220" width="48" height="6" rx="3" fill="#783efe" fill-opacity="0.9"/>

  <!-- Floating Poster Zoom Slider (Bottom Center) -->
  <rect x="410" y="484" width="140" height="28" rx="14" fill="#090b12" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.16"/>
  <rect x="434" y="496" width="92" height="4" rx="2" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="434" y="496" width="54" height="4" rx="2" fill="#783efe"/>
  <circle cx="488" cy="498" r="6.5" fill="#ffffff"/>

  <!-- Layout Mode Badge (Bottom Left) -->
  <rect x="26" y="486" width="118" height="24" rx="8" fill="#783efe" fill-opacity="0.22" stroke="#783efe" stroke-opacity="0.55"/>
  <text x="85" y="502" text-anchor="middle" fill="#e2d9ff" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8">FULL GRID VIEW</text>
</svg>
